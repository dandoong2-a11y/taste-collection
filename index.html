<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>좋아서 모아둔 것들</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem("taste-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<style>

  /* 디자인 토큰: 연한 파스텔 핑크 + 복숭아빛 포인트 + 부드러운 플럼 글자 */
  :root {
    --bg:#fff6f9; --ivory:#fffefe; --blush:#fde3ec; --blush2:#fff0f5;
    --rose:#e386a8; --rose-d:#c9547f; --plum:#5a3a48; --sub:#9a7684;
    --line:#f7d9e4; --rule:#fbe8ef; --gold:#e0a96e; --star:#e8a06a;
    --shadow:0 1px 2px rgba(var(--ink),.06), 0 10px 26px rgba(var(--glow),.09);
    --shadow-up:0 2px 4px rgba(var(--ink),.07), 0 16px 34px rgba(var(--glow),.15);
    --serif:"Gowun Batang","Noto Serif KR",Georgia,serif;
    --sans:"Gowun Dodum","Malgun Gothic",sans-serif;
  }
  /* 테마: 설정에서 고르면 html의 data-theme 값이 바뀌어요 */
  :root { --paper:#fff; --on:#fff; --muted:#c9a4b3; --favoff:#e6c0cd; --glow:227,134,168; --ink:110,66,84;
          --hd1:#fde6ee; --nav:rgba(255,254,254,.92); --bg-grad:linear-gradient(180deg,#ffe9f1 0%,#fff6f9 30%,#fffafb 100%); }
  html[data-theme="lavender"] { --bg:#f6f3fb; --ivory:#fffeff; --blush:#e6def3; --blush2:#efe9f8; --rose:#7b5ea7; --rose-d:#5f4488; --plum:#2f2840; --sub:#6c6480;
    --line:#ddd5ec; --rule:#e8e2f2; --muted:#9a90b0; --favoff:#b7aed0; --glow:123,94,167; --ink:47,40,64; --hd1:#e9e1f5; --nav:rgba(255,254,255,.92);
    --bg-grad:linear-gradient(180deg,#ece4f6 0%,#f6f3fb 28%,#faf8fd 100%); }
  html[data-theme="mint"] { --bg:#f1f8f4; --ivory:#fcfffd; --blush:#d8ede3; --blush2:#e6f4ec; --rose:#3f8f7a; --rose-d:#2c6e5d; --plum:#23382f; --sub:#5c7268;
    --line:#cfe4da; --rule:#e1efe8; --muted:#8aa398; --favoff:#a9c4b8; --glow:63,143,122; --ink:35,56,47; --hd1:#def0e6; --nav:rgba(252,255,253,.92);
    --bg-grad:linear-gradient(180deg,#e2f2e9 0%,#f1f8f4 28%,#f8fcfa 100%); }
  html[data-theme="mocha"] { --bg:#faf4ec; --ivory:#fffdf9; --blush:#f0e2d0; --blush2:#f6ecdf; --rose:#a8704a; --rose-d:#85542f; --plum:#3a2c22; --sub:#7a6a5c;
    --line:#e6d8c8; --rule:#efe4d6; --muted:#a99887; --favoff:#c7b7a5; --glow:168,112,74; --ink:58,44,34; --hd1:#f2e5d4; --nav:rgba(255,253,249,.92);
    --bg-grad:linear-gradient(180deg,#f3e6d6 0%,#faf4ec 28%,#fdf9f4 100%); }
  html[data-theme="night"] { color-scheme:dark; --bg:#1d1619; --ivory:#2a2024; --blush:#3a2b32; --blush2:#33262c; --rose:#e48bb0; --rose-d:#f0a9c6; --plum:#f3e6ea; --sub:#bba5ad;
    --line:#46353c; --rule:#3a2c32; --gold:#d2a878; --star:#e0a07a; --paper:#34282e; --on:#2b1520; --muted:#9c858e; --favoff:#7d6870; --glow:228,139,176; --ink:0,0,0;
    --hd1:#2a1e23; --nav:rgba(42,32,36,.92); --bg-grad:linear-gradient(180deg,#261b20 0%,#1d1619 40%,#1d1619 100%); }
  .themes { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  .themes button { flex:1 1 56px; min-height:68px; border:1px solid var(--line); border-radius:14px; background:var(--paper); color:var(--plum); cursor:pointer; font-size:.82rem;
                   display:grid; place-items:center; align-content:center; gap:6px; padding:8px 4px; }
  .themes button i { width:26px; height:26px; border-radius:50%; display:block; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08); }
  .themes button[aria-pressed="true"] { border:2px solid var(--rose); font-weight:bold; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:var(--sans); color:var(--plum); line-height:1.6;
         background:var(--bg-grad); min-height:100vh; padding-bottom:100px; }
  button { font-family:inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:3px solid var(--rose); outline-offset:2px; }

  /* 헤더 */
  header { text-align:center; padding:56px 16px 30px; position:relative; border-bottom:1px solid var(--line);
           background:linear-gradient(180deg,var(--hd1),var(--bg)); }
  header h1 { margin:0 0 10px; font-family:var(--serif); font-weight:700; font-size:2.3rem; letter-spacing:.08em; color:var(--rose-d); }
  header p { margin:0; color:var(--sub); font-size:1rem; letter-spacing:.05em; }
  header::after { content:""; display:block; width:48px; height:1px; background:var(--gold); margin:18px auto 0; }
  #setBtn { position:absolute; top:14px; right:max(14px, env(safe-area-inset-right, 0px)); min-height:40px; padding:0 18px; border:1px solid var(--line);
            border-radius:20px; background:var(--nav); color:var(--sub); font-size:.9rem; letter-spacing:.06em; cursor:pointer; }
  #setBtn:hover { border-color:var(--rose); color:var(--rose-d); }

  /* 도감: 폴더 */
  #folders { display:flex; flex-wrap:wrap; justify-content:center; gap:12px; padding:28px 16px 0; }
  .folder { width:124px; padding:16px 10px 13px; text-align:center; cursor:pointer; background:var(--ivory); border:1px solid var(--line);
            border-radius:16px; font-size:.95rem; color:var(--plum); box-shadow:var(--shadow); transition:transform .18s, box-shadow .18s, background .18s; }
  .folder:hover { transform:translateY(-3px); box-shadow:var(--shadow-up); }
  .folder .ico { font-size:1.6rem; display:block; line-height:1.3; }
  .folder b { display:block; margin-top:4px; font-weight:bold; letter-spacing:.04em; }
  .folder small { color:var(--sub); }
  .folder.on { background:var(--rose); border-color:var(--rose); color:var(--on); }
  .folder.on small { color:var(--on); opacity:.85; }

  .tools { text-align:center; padding:22px 16px 0; }
  .tools input[type=text] { padding:11px 18px; width:min(300px,68%); border:1px solid var(--line); border-radius:24px; font-size:1rem; background:var(--ivory); color:var(--plum); }
  #addBtn { margin-left:8px; padding:0 22px; min-height:44px; border:none; border-radius:24px; cursor:pointer; background:var(--rose); color:var(--on);
            font-size:1rem; letter-spacing:.04em; box-shadow:0 4px 12px rgba(var(--glow),.28); transition:background .18s; }
  #addBtn:hover { background:var(--rose-d); }

  #grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:22px; max-width:1000px; margin:28px auto; padding:0 16px; }
  .card { position:relative; background:var(--ivory); border-radius:18px; padding:30px 20px 20px; text-align:center; cursor:pointer;
          border:1px solid var(--line); box-shadow:var(--shadow); transition:transform .2s, box-shadow .2s; }
  .card:hover { transform:translateY(-4px); box-shadow:var(--shadow-up); }
  .emoji { font-size:3.2rem; line-height:1.2; }
  .card h3 { margin:10px 0 6px; font-family:var(--serif); font-size:1.15rem; letter-spacing:.03em; }
  .tag { display:inline-block; background:var(--blush2); color:var(--rose-d); border:1px solid var(--line); font-size:.78rem; padding:1px 11px; border-radius:12px; letter-spacing:.04em; }
  .stars { color:var(--star); margin:8px 0; font-size:1rem; letter-spacing:2px; }
  .card p { margin:0; font-size:.93rem; color:var(--sub); }
  .more { margin-top:12px; font-size:.78rem; color:var(--rose); letter-spacing:.04em; }
  .del, .edt, .fav { position:absolute; top:6px; border:none; background:none; cursor:pointer; min-width:34px; min-height:34px; }
  .del { right:6px; color:var(--muted); font-size:1rem; } .del:hover { color:var(--rose-d); }
  .edt { left:6px; color:var(--muted); font-size:.95rem; } .edt:hover { color:var(--rose-d); }
  .fav { left:40px; color:var(--favoff); font-size:1.2rem; line-height:1.2; } .fav:hover, .fav.on { color:var(--rose); }
  .photo { width:108px; height:108px; object-fit:cover; border-radius:50%; border:3px solid var(--paper); box-shadow:0 0 0 1px var(--line), 0 6px 14px rgba(var(--glow),.18); display:block; margin:0 auto; }
  .empty { text-align:center; color:var(--sub); padding:20px 16px; display:none; }

  /* 일기 */
  .view { max-width:560px; margin:0 auto; padding:28px 16px 0; }
  .view[hidden] { display:none; }
  .vtitle { font-family:var(--serif); font-weight:700; font-size:1.65rem; letter-spacing:.06em; text-align:center; margin:0; color:var(--rose-d); }
  .stats { text-align:center; color:var(--sub); margin:4px 0 22px; font-size:.95rem; letter-spacing:.03em; }
  .recall { background:var(--ivory); border:1px solid var(--line); border-radius:16px; padding:12px 18px; margin-bottom:24px; box-shadow:var(--shadow); }
  .recall b { color:var(--rose-d); letter-spacing:.04em; }
  .recall button { display:block; width:100%; text-align:left; border:none; background:none; padding:7px 0; cursor:pointer; color:var(--plum); font-size:.95rem; }
  .page { position:relative; background-color:var(--ivory); border-radius:4px 16px 16px 4px; padding:26px 20px 14px 24px; margin-bottom:26px; cursor:pointer;
          background-image:repeating-linear-gradient(transparent 0 27px, var(--rule) 27px 28px); background-position:0 42px;
          box-shadow:var(--shadow); border:1px solid var(--line); border-left:4px solid var(--rose); transition:transform .2s, box-shadow .2s; }
  .page:hover { transform:translateY(-2px); box-shadow:var(--shadow-up); }
  .tape { position:absolute; top:-9px; left:50%; width:60px; height:17px; margin-left:-30px; background:rgba(181,138,92,.32); transform:rotate(-2deg); }
  .dhead { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; }
  .date { font-family:var(--serif); font-weight:700; font-size:1.35rem; color:var(--rose-d); line-height:1.2; letter-spacing:.03em; }
  .dow { color:var(--sub); font-size:.88rem; }
  .mood { margin-left:auto; font-size:1.6rem; }
  .body { line-height:28px; white-space:pre-wrap; word-break:break-word; }
  .polaroid { float:right; width:104px; margin:2px 0 8px 12px; padding:7px 7px 17px; background:var(--paper); transform:rotate(2.5deg); box-shadow:0 4px 12px rgba(var(--ink),.2); }
  .polaroid img { width:100%; height:84px; object-fit:cover; display:block; }
  .attach { display:inline-flex; align-items:center; gap:6px; background:var(--blush2); color:var(--plum); border:1px solid var(--line); border-radius:16px;
            padding:3px 12px 3px 5px; margin:4px 6px 0 0; font-size:.85rem; line-height:22px; cursor:pointer; min-height:32px; }
  .attach i { font-style:normal; width:24px; height:24px; border-radius:50%; background:var(--paper); display:grid; place-items:center; }
  .fabd { position:fixed; right:max(18px, env(safe-area-inset-right, 0px)); bottom:82px; z-index:21; width:56px; height:56px; border-radius:50%; border:none;
          background:var(--rose); color:var(--on); font-size:1.8rem; line-height:1; cursor:pointer; box-shadow:0 8px 20px rgba(var(--glow),.4); }
  .fabd:hover { background:var(--rose-d); }
  .fabd[hidden] { display:none; }

  /* 달력 */
  .calnav { display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:4px; }
  .calnav button { width:44px; height:44px; border:1px solid var(--line); border-radius:50%; background:var(--ivory); color:var(--rose-d); font-size:1.2rem; cursor:pointer; }
  .calnav button:hover { border-color:var(--rose); }
  .calnav .vtitle { min-width:9em; }
  .cal { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; text-align:center; margin-top:10px; }
  .cal .dn { color:var(--sub); font-size:.82rem; padding:2px 0; letter-spacing:.06em; }
  .cal button, .cal .blank { aspect-ratio:1; border-radius:14px; }
  .cal button { border:1px solid var(--line); background:var(--ivory); display:grid; place-items:center; align-content:center; font-size:.85rem; color:var(--sub); line-height:1.1; cursor:pointer; padding:0; }
  .cal button:hover { border-color:var(--rose); }
  .cal button.has { background:var(--blush); color:var(--plum); border-color:var(--blush); }
  .cal button.today { border:2px solid var(--rose); }
  .cal button em { font-style:normal; font-size:1.3rem; }
  .legend { text-align:center; color:var(--sub); font-size:.88rem; margin:16px 0 20px; }

  /* 하단 탭 */
  .nav { position:fixed; left:0; right:0; bottom:0; z-index:20; height:64px; display:flex; background:var(--nav); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
         border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom, 0px); box-sizing:content-box; }
  .nav button { flex:1; border:none; background:none; cursor:pointer; font-size:.78rem; color:var(--sub); display:grid; place-items:center; align-content:center; gap:3px; letter-spacing:.06em; position:relative; }
  .nav button svg { width:23px; height:23px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
  .nav button[aria-selected="true"] { color:var(--rose); font-weight:bold; }
  .nav button[aria-selected="true"]::before { content:""; position:absolute; top:0; width:28px; height:2px; background:var(--rose); border-radius:0 0 2px 2px; }

  /* 팝업 공통 */
  .ov { display:none; position:fixed; inset:0; z-index:50; background:rgba(var(--ink),.5); backdrop-filter:blur(2px); align-items:center; justify-content:center; padding:16px; }
  .ov.show { display:flex; }
  .box { position:relative; background:var(--ivory); border-radius:22px; padding:26px 24px; width:min(420px,100%); max-height:92vh; overflow:auto; border:1px solid var(--line); box-shadow:0 20px 50px rgba(var(--ink),.3); }
  .box h2 { margin:0 0 14px; text-align:center; font-family:var(--serif); letter-spacing:.05em; color:var(--rose-d); }
  .box label { display:block; margin:12px 0 5px; font-size:.82rem; color:var(--sub); letter-spacing:.05em; }
  .box input, .box select, .box textarea { width:100%; padding:10px 13px; border:1px solid var(--line); border-radius:12px; font-size:1rem; background:var(--paper); font-family:inherit; color:var(--plum); }
  .box textarea { resize:vertical; min-height:90px; }
  .btns { display:flex; gap:8px; margin-top:20px; }
  .btns button { flex:1; min-height:46px; border:none; border-radius:24px; font-size:1rem; cursor:pointer; letter-spacing:.04em; }
  .b-main { background:var(--rose); color:var(--on); }
  .b-main:hover { background:var(--rose-d); }
  .b-sub { background:var(--blush2); color:var(--plum); border:1px solid var(--line) !important; }
  .b-del { background:var(--paper); color:#a93246; border:1px solid #ecc1c8 !important; }
  .b-del[hidden] { display:none; }
  .photoBox { text-align:center; } #fPhoto, #dfPhoto { padding:6px; }
  .pv { display:none; width:90px; height:90px; object-fit:cover; border-radius:50%; border:3px solid var(--paper); box-shadow:0 0 0 1px var(--line); margin:10px auto 0; }
  .rm { display:none; margin:6px auto 0; border:none; background:none; cursor:pointer; color:var(--rose-d); font-size:.88rem; text-decoration:underline; }

  /* 상세 */
  #dBox { text-align:center; padding:34px 26px 24px; }
  #dClose { position:absolute; top:10px; right:12px; width:40px; height:40px; border:none; background:none; cursor:pointer; font-size:1.2rem; color:var(--muted); }
  #dEmoji { font-size:4.2rem; line-height:1.2; }
  #dPhoto { width:168px; height:168px; display:none; margin:0 auto 4px; }
  #dName { margin:10px 0 8px; font-family:var(--serif); font-size:1.6rem; color:var(--rose-d); }
  #dMemo { margin:12px 0 0; font-weight:bold; }
  #dText { margin:14px 0 0; padding:15px; background:var(--blush2); border-radius:14px; text-align:left; line-height:1.75; white-space:pre-wrap; }
  #dDate { margin-top:12px; font-size:.82rem; color:var(--sub); letter-spacing:.03em; }
  .drel { text-align:left; margin-top:18px; }
  .drel h4 { margin:0 0 8px; font-size:.92rem; letter-spacing:.04em; color:var(--rose-d); }
  .rel { display:flex; width:100%; gap:12px; align-items:center; border:1px solid var(--line); background:var(--paper); border-radius:14px; padding:9px 12px; margin-bottom:6px; cursor:pointer; text-align:left; color:var(--plum); font-size:.9rem; }
  .rel:hover { border-color:var(--rose); }
  .rel .m { font-size:1.4rem; } .rel small { color:var(--sub); display:block; }
  .dbtns { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:16px; }
  .dbtns button { padding:0 18px; min-height:44px; border:1px solid var(--line); border-radius:24px; cursor:pointer; background:var(--blush2); color:var(--plum); font-size:.93rem; }
  .dbtns button:hover { border-color:var(--rose); }
  #dFav { background:var(--paper); color:var(--rose-d); }

  /* 일기 쓰기 */
  .moods { display:flex; gap:6px; margin:4px 0 6px; }
  .moods button { flex:1; min-height:48px; border-radius:14px; border:1px solid var(--line); background:var(--paper); font-size:1.5rem; cursor:pointer; }
  .moods button[aria-pressed="true"] { border:2px solid var(--rose); background:var(--blush2); }
  .picks { display:flex; flex-wrap:wrap; gap:6px; max-height:128px; overflow:auto; }
  .pick { border:1px solid var(--line); background:var(--paper); color:var(--plum); border-radius:18px; padding:5px 13px; cursor:pointer; font-size:.9rem; min-height:36px; }
  .pick[aria-pressed="true"] { border:1px solid var(--rose); background:var(--blush); font-weight:bold; }
  .nopick { color:var(--sub); font-size:.9rem; }

  /* 설정 */
  .sline { margin:0 0 6px; color:var(--sub); font-size:.92rem; line-height:1.7; }
  .sgrp { margin:18px 0 4px; font-weight:bold; color:var(--rose-d); letter-spacing:.04em; }

  /* 확인창, 알림 */
  #ask { z-index:70; }
  #askMsg { text-align:center; margin:6px 0 0; line-height:1.7; }
  #toast { position:fixed; left:50%; bottom:92px; transform:translateX(-50%); z-index:100; background:var(--plum); color:var(--bg); padding:11px 20px; border-radius:22px;
           font-size:.93rem; max-width:90vw; text-align:center; opacity:0; pointer-events:none; transition:opacity .25s; box-shadow:0 8px 22px rgba(var(--ink),.3); }
  #toast.show { opacity:1; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
  @media (max-width:520px) { header h1 { font-size:1.9rem; letter-spacing:.05em; } #folders { gap:8px; padding-left:12px; padding-right:12px; } .folder { width:calc(33.333% - 6px); max-width:130px; padding:14px 6px 11px; } }
</style>
</head>
<body>

<header>
  <button id="setBtn" aria-label="설정과 백업">설정</button>
  <h1>좋아서 모아둔 것들</h1>
  <p>오늘도 마음에 쏙 든 것들을 한 칸씩 담아요</p>
</header>

<!-- 도감 -->
<main id="viewDex">
  <div id="folders"></div>
  <div class="tools">
    <input type="text" id="search" placeholder="이름으로 검색" aria-label="이름으로 검색">
    <button id="addBtn">＋ 담기</button>
  </div>
  <div id="grid"></div>
  <p id="empty" class="empty"></p>
</main>

<!-- 일기 -->
<main id="viewDiary" class="view" hidden>
  <h2 class="vtitle">나의 일기</h2>
  <p class="stats" id="dStats"></p>
  <div id="recallD"></div>
  <div id="diaryList"></div>
  <p id="diaryEmpty" class="empty"></p>
</main>

<!-- 달력 -->
<main id="viewCal" class="view" hidden>
  <div class="calnav">
    <button id="calPrev" aria-label="이전 달">‹</button>
    <h2 class="vtitle" id="calTitle"></h2>
    <button id="calNext" aria-label="다음 달">›</button>
  </div>
  <p class="stats" id="calStats"></p>
  <div class="cal" id="cal"></div>
  <p class="legend">날짜를 누르면 그날의 일기를 쓰거나 고칠 수 있어요</p>
  <div id="recallC"></div>
</main>

<button class="fabd" id="fabDiary" aria-label="일기 쓰기" hidden>＋</button>

<nav class="nav" role="tablist" aria-label="화면 이동">
  <button role="tab" data-v="dex" aria-selected="true">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 19.5A2 2 0 0 0 6 21.5h13"/></svg>도감</button>
  <button role="tab" data-v="diary" aria-selected="false">

<script>
/* ✏️ 폴더 목록 (이름과 아이콘을 바꿀 수 있어요) */
const folders = [
  { name:"음식", icon:"🍰" },
  { name:"게임", icon:"🎮" },
  { name:"카페", icon:"☕" },
  { name:"물건", icon:"🧸" },
];

/* ✏️ 처음에 보이는 예시 카드 (추가한 카드는 브라우저에 자동 저장돼요) */
const starter = [
  { emoji:"🍰", name:"딸기 케이크", type:"음식", stars:5, memo:"생일 때마다 먹고 싶은 맛!",
    detail:"생크림이 너무 달지 않고 딸기가 듬뿍 올라간 케이크가 제일 좋아요.\n생일이나 기분 좋은 날에 꼭 먹어요." },
  { emoji:"🍜", name:"매운 라면",   type:"음식", stars:4, memo:"스트레스 받을 때 최고.",
    detail:"땀이 날 정도로 매운 라면이 좋아요.\n치즈를 넣으면 맛이 부드러워져서 더 맛있어요." },
  { emoji:"🎮", name:"마인크래프트", type:"게임", stars:5, memo:"친구들과 같이 하면 시간 순삭.",
    detail:"집을 짓고 탐험하다 보면 시간 가는 줄 몰라요.\n친구들과 같은 서버에서 함께 할 때 제일 재미있어요." },
  { emoji:"🏃", name:"달리기 게임", type:"게임", stars:3, memo:"짧게 하기 좋아요.",
    detail:"한 판이 짧아서 쉬는 시간에 가볍게 하기 좋아요." },
  { emoji:"☕", name:"우리동네 카페", type:"카페", stars:5, memo:"조용해서 공부하기 딱 좋아요.",
    detail:"창가 자리가 있고 음악이 잔잔해서 공부하기 좋아요.\n시그니처 메뉴는 따뜻한 라떼예요." },
  { emoji:"🧋", name:"버블티",       type:"카페", stars:4, memo:"타피오카는 많이 넣어서!",
    detail:"당도 50%에 타피오카 추가가 나만의 주문 공식이에요." },
  { emoji:"🧸", name:"곰돌이 인형", type:"물건", stars:5, memo:"어릴 때부터 함께한 내 보물.",
    detail:"생일 선물로 받은 인형이에요.\n이사할 때도 꼭 챙겨 가요." },
  { emoji:"🎧", name:"분홍 헤드폰", type:"물건", stars:4, memo:"쓰면 기분이 좋아지는 색.",
    detail:"공부할 때나 이동할 때 늘 가지고 다녀요." },
];
/* ============== 여기 아래는 안 건드려도 돼요 ============== */

const $ = id => document.getElementById(id);
const MOODS = ["😊","🥳","😌","😴","😢"];
const DOW = ["일","월","화","수","목","금","토"];
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const parseYmd = s => { const p = s.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const TODAY = ymd(new Date());

function esc(s) { return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function safePhoto(p) { return (typeof p === "string" && p.indexOf("data:image/") === 0 && p.indexOf('"') < 0) ? p : ""; }

/* ---------- 저장 데이터 정리 (불러온 파일도 같은 규칙으로 걸러요) ---------- */
function cleanItem(i) {
  return {
    emoji: String(i.emoji || "⭐"), name: String(i.name || "이름 없음"), type: String(i.type || folders[0].name),
    stars: Math.min(5, Math.max(1, Math.round(Number(i.stars)) || 3)), memo: String(i.memo || ""),
    detail: String(i.detail || ""), photo: safePhoto(i.photo), fav: !!i.fav, date: String(i.date || ""),
  };
}
function cleanEntry(e) {
  return {
    id: String(e.id || uid()), date: String(e.date), mood: MOODS.indexOf(e.mood) >= 0 ? e.mood : "😊",
    text: String(e.text || ""), photo: safePhoto(e.photo),
    cards: Array.isArray(e.cards) ? e.cards.map(String) : [],
  };
}
function makeStarterDiary() {
  const t = new Date();
  const back = n => ymd(new Date(t.getFullYear(), t.getMonth(), t.getDate() - n));
  return [
    { id:uid(), date:back(0), mood:"😊", photo:"", cards:["딸기 케이크"],
      text:"드디어 내 웹사이트가 열렸다. 링크를 눌러 보니 진짜 내 사이트였다. 기념으로 케이크!" },
    { id:uid(), date:back(1), mood:"😴", photo:"", cards:["우리동네 카페"],
      text:"비 오는 날. 창가 자리에서 라떼를 마시며 오래 앉아 있었다." },
    { id:uid(), date:back(3), mood:"🥳", photo:"", cards:["마인크래프트"],
      text:"친구들과 새벽까지 집을 지었다. 시간이 순식간에 지나갔다." },
    { id:uid(), date:ymd(new Date(t.getFullYear() - 1, t.getMonth(), t.getDate())), mood:"😊", photo:"", cards:["매운 라면"],
      text:"작년 오늘은 매운 라면에 치즈를 넣어 먹은 날이었다." },
  ];
}

let items = starter.map(cleanItem), diary = null;
try { const s = localStorage.getItem("taste-items"); if (s) items = JSON.parse(s).map(cleanItem); } catch (e) {}
try { const s = localStorage.getItem("taste-diary"); if (s) diary = JSON.parse(s).map(cleanEntry); } catch (e) {}
if (!Array.isArray(diary)) diary = makeStarterDiary();

function save() {
  try {
    localStorage.setItem("taste-items", JSON.stringify(items));
    localStorage.setItem("taste-diary", JSON.stringify(diary));
    return true;
  } catch (e) {
    toast("저장 공간이 부족해요. 사진을 줄이거나 안 쓰는 카드를 지워 보세요. 지금 내용은 새로고침하면 사라질 수 있어요.");
    return false;
  }
}

/* ---------- 알림, 확인창 ---------- */
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}
function ask(msg, yes) {
  return new Promise(resolve => {
    $("askMsg").textContent = msg; $("askYes").textContent = yes || "확인";
    $("ask").classList.add("show");
    const done = v => { $("ask").classList.remove("show"); $("askYes").onclick = $("askNo").onclick = null; resolve(v); };
    $("askYes").onclick = () => done(true); $("askNo").onclick = () => done(false);
  });
}

/* ---------- 사진 고르기: 가로세로 최대 500px로 줄여서 저장 ---------- */
function readPhoto(file, done) {
  if (!file) return;
  if (!file.type.startsWith("image/")) { toast("이미지 파일을 골라주세요."); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 500 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL("image/jpeg", 0.8));
    };
    img.onerror = () => toast("이 사진은 불러올 수 없어요. 다른 사진을 골라주세요.");
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- 화면 전환 ---------- */
let view = "dex";
function setView(v) {
  view = v;
  const ids = { dex:"viewDex", diary:"viewDiary", cal:"viewCal" };
  Object.keys(ids).forEach(k => { $(ids[k]).hidden = k !== v; });
  document.querySelectorAll(".nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.v === v ? "true" : "false"));
  $("fabDiary").hidden = v === "dex";
  window.scrollTo(0, 0);
}
document.querySelectorAll(".nav button").forEach(b => { b.onclick = () => setView(b.dataset.v); });

function refresh() { renderFolders(); renderCards(); renderDiary(); renderCal(); }

/* =====================  도감  ===================== */
let current = "전체";

function renderFolders() {
  const all = [{ name:"전체", icon:"📁" }, ...folders, { name:"즐겨찾기", icon:"💗" }];
  $("folders").innerHTML = "";
  all.forEach(f => {
    const n = f.name === "전체" ? items.length
            : f.name === "즐겨찾기" ? items.filter(i => i.fav).length
            : items.filter(i => i.type === f.name).length;
    const b = document.createElement("button");
    b.className = "folder" + (f.name === current ? " on" : "");
    b.innerHTML = `<span class="ico">${f.icon}</span><b>${f.name}</b><small>${n}개</small>`;
    b.onclick = () => { current = f.name; renderFolders(); renderCards(); };
    $("folders").appendChild(b);
  });
}

function renderCards() {
  const word = $("search").value.trim();
  const shown = items.map((it, idx) => ({ it, idx }))
    .filter(({ it }) => (current === "전체" || (current === "즐겨찾기" ? it.fav : it.type === current)) && it.name.includes(word));
  $("grid").innerHTML = shown.map(({ it, idx }) => `
    <div class="card" onclick="openDetail(${idx})">
      <button class="edt" title="수정" aria-label="수정" onclick="event.stopPropagation(); openForm(${idx})">✏️</button>
      <button class="fav${it.fav ? " on" : ""}" title="즐겨찾기" aria-label="즐겨찾기" onclick="event.stopPropagation(); toggleFav(${idx})">${it.fav ? "♥" : "♡"}</button>
      <button class="del" title="삭제" aria-label="삭제" onclick="event.stopPropagation(); removeItem(${idx})">✕</button>
      ${it.photo ? `<img class="photo" src="${it.photo}" alt="">` : `<div class="emoji">${esc(it.emoji)}</div>`}
      <h3>${esc(it.name)}</h3>
      <span class="tag">${esc(it.type)}</span>
      <div class="stars">${"★".repeat(it.stars)}${"☆".repeat(5 - it.stars)}</div>
      <p>${esc(it.memo)}</p>
      <div class="more">눌러서 자세히 보기</div>
    </div>`).join("");
  $("empty").textContent = current === "즐겨찾기"
    ? "아직 즐겨찾기가 없어요. 카드의 ♡를 눌러 보세요"
    : "아직 텅 비어 있어요. 좋아하는 걸 하나 담아볼까요?";
  $("empty").style.display = shown.length ? "none" : "block";
}

function toggleFav(idx) { items[idx].fav = !items[idx].fav; save(); refresh(); }

async function removeItem(idx) {
  if (!(await ask("이 카드를 삭제할까요? 이 카드를 연결한 일기는 그대로 남아요.", "삭제"))) return;
  items.splice(idx, 1); save(); refresh();
}

/* ----- 카드 상세 ----- */
let detailIdx = null;
const byDateDesc = (a, b) => b.date.localeCompare(a.date);
const relatedFor = name => diary.filter(e => e.cards.indexOf(name) >= 0).sort(byDateDesc);
const shortDate = d => { const x = parseYmd(d); return `${x.getFullYear()}년 ${x.getMonth() + 1}월 ${x.getDate()}일`; };

function refreshDetailFav() {
  const on = items[detailIdx] && items[detailIdx].fav;
  $("dFav").textContent = on ? "♥ 즐겨찾기 해제" : "♡ 즐겨찾기";
}
function openDetail(idx) {
  const it = items[idx]; if (!it) return;
  detailIdx = idx; refreshDetailFav();
  $("dPhoto").style.display = it.photo ? "block" : "none";
  if (it.photo) $("dPhoto").src = it.photo;
  $("dEmoji").style.display = it.photo ? "none" : "block";
  $("dEmoji").textContent = it.emoji;
  $("dName").textContent = it.name; $("dTag").textContent = it.type;
  $("dStars").textContent = "★".repeat(it.stars) + "☆".repeat(5 - it.stars);
  $("dMemo").textContent = it.memo;
  $("dText").textContent = it.detail || "아직 자세한 설명이 없어요. 아래 「수정하기」로 적어볼까요?";
  $("dText").style.display = "block";
  $("dDate").textContent = it.date ? "담은 날 · " + it.date : "";
  $("dDate").style.display = it.date ? "block" : "none";
  const rel = relatedFor(it.name);
  $("dRel").innerHTML = `<h4>이 카드가 나온 일기 ${rel.length}편</h4>` + (rel.length
    ? rel.map(e => `<button class="rel" data-id="${esc(e.id)}"><span class="m">${e.mood}</span><span><b>${shortDate(e.date)}</b><small>${esc(e.text.slice(0, 30))}${e.text.length > 30 ? "…" : ""}</small></span></button>`).join("")
    : `<p class="sline">아직 이 카드로 쓴 일기가 없어요.</p>`);
  $("detail").classList.add("show");
}
function closeDetail() { $("detail").classList.remove("show"); }
$("dClose").onclick = closeDetail;
$("detail").onclick = e => { if (e.target === $("detail")) closeDetail(); };
$("dFav").onclick = () => { toggleFav(detailIdx); refreshDetailFav(); };
$("dEdit").onclick = () => { const i = detailIdx; closeDetail(); openForm(i); };
$("dWrite").onclick = () => { const n = items[detailIdx].name; closeDetail(); openDiaryForm({ card:n }); };
$("dRel").onclick = e => {
  const b = e.target.closest(".rel"); if (!b) return;
  closeDetail(); openDiaryForm({ id:b.dataset.id });
};

/* ----- 카드 추가·수정 창 ----- */
let editIdx = null, formPhoto = "";
folders.forEach(f => {
  const o = document.createElement("option");
  o.value = f.name; o.textContent = f.icon + " " + f.name; $("fType").appendChild(o);
});
function showPreview() {
  $("pPreview").style.display = formPhoto ? "block" : "none"; $("pPreview").src = formPhoto;
  $("pRemove").style.display = formPhoto ? "inline-block" : "none";
}
function openForm(idx) {
  editIdx = (typeof idx === "number") ? idx : null;
  if (editIdx !== null) {
    const it = items[editIdx];
    $("fTitle").textContent = "카드 수정하기";
    $("fType").value = it.type; $("fEmoji").value = it.emoji; $("fName").value = it.name;
    $("fStars").value = it.stars; $("fMemo").value = it.memo; $("fDetail").value = it.detail || "";
    formPhoto = it.photo || "";
  } else {
    $("fTitle").textContent = "오늘의 좋아함 담기";
    if (folders.some(f => f.name === current)) $("fType").value = current;
    formPhoto = "";
  }
  showPreview(); $("modal").classList.add("show"); $("fName").focus();
}
function closeModal() { $("modal").classList.remove("show"); $("form").reset(); editIdx = null; formPhoto = ""; showPreview(); }
$("addBtn").onclick = () => openForm();
$("cancel").onclick = closeModal;
$("modal").onclick = e => { if (e.target === $("modal")) closeModal(); };
$("fPhoto").onchange = e => readPhoto(e.target.files[0], url => { formPhoto = url; showPreview(); });
$("pRemove").onclick = () => { formPhoto = ""; $("fPhoto").value = ""; showPreview(); };
$("form").onsubmit = e => {
  e.preventDefault();
  const type = $("fType").value;
  const icon = folders.find(f => f.name === type).icon;
  const old = editIdx !== null ? items[editIdx] : null;
  const data = {
    emoji: $("fEmoji").value.trim() || icon, name: $("fName").value.trim(), type,
    stars: Number($("fStars").value), memo: $("fMemo").value.trim() || "내가 좋아하는 것!",
    detail: $("fDetail").value.trim(), photo: formPhoto, fav: old ? !!old.fav : false,
    date: old ? (old.date || "") : new Date().toLocaleDateString("ko-KR"),
  };
  if (old && old.name !== data.name) {          // 이름을 바꾸면 일기의 연결도 같이 바꿔요
    diary.forEach(en => { en.cards = en.cards.map(n => n === old.name ? data.name : n); });
  }
  if (old) items[editIdx] = data; else items.push(data);
  save(); closeModal(); current = type; refresh();
};
$("search").oninput = renderCards;

/* =====================  일기  ===================== */
function streak() {
  const set = new Set(diary.map(e => e.date));
  const d = new Date();
  if (!set.has(ymd(d))) d.setDate(d.getDate() - 1);
  let n = 0;
  while (set.has(ymd(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function monthCount(prefix) { return diary.filter(e => e.date.indexOf(prefix) === 0).length; }
function statsText(prefix) {
  const s = streak();
  return `이번 달 ${monthCount(prefix)}편` + (s > 0 ? ` · 연속 ${s}일째 기록 중` : "");
}
function recallHtml() {
  const md = TODAY.slice(5), yr = TODAY.slice(0, 4);
  const past = diary.filter(e => e.date.slice(5) === md && e.date.slice(0, 4) < yr).sort(byDateDesc);
  if (!past.length) return "";
  return `<div class="recall"><b>지난 오늘</b>` + past.map(e => {
    const y = e.date.slice(0, 4);
    return `<button data-id="${esc(e.id)}">${TODAY.slice(0, 4) - y}년 전 · ${e.mood} ${esc(e.text.slice(0, 40))}${e.text.length > 40 ? "…" : ""}</button>`;
  }).join("") + `</div>`;
}
function cardIcon(name) {
  const c = items.find(i => i.name === name);
  return c ? esc(c.emoji) : "📌";
}
function renderDiary() {
  $("dStats").textContent = statsText(TODAY.slice(0, 7));
  $("recallD").innerHTML = recallHtml();
  const list = diary.slice().sort(byDateDesc);
  const thisYear = TODAY.slice(0, 4);
  $("diaryList").innerHTML = list.map(e => {
    const d = parseYmd(e.date);
    return `<article class="page" data-id="${esc(e.id)}"><span class="tape"></span>
      <div class="dhead"><span class="date">${d.getMonth() + 1}월 ${d.getDate()}일</span>
        <span class="dow">${DOW[d.getDay()]}요일${String(d.getFullYear()) !== thisYear ? " · " + d.getFullYear() : ""}</span>
        <span class="mood">${e.mood}</span></div>
      ${e.photo ? `<div class="polaroid"><img src="${e.photo}" alt=""></div>` : ""}
      <div class="body">${esc(e.text)}</div>
      ${e.cards.map(n => `<button class="attach" data-card="${esc(n)}"><i>${cardIcon(n)}</i>${esc(n)}</button>`).join("")}
    </article>`;
  }).join("");
  $("diaryEmpty").textContent = "아직 일기가 없어요. 오른쪽 아래 ＋를 눌러 오늘 하루를 적어보세요";
  $("diaryEmpty").style.display = list.length ? "none" : "block";
}
function openCardByName(name) {
  const idx = items.findIndex(i => i.name === name);
  if (idx < 0) { toast("도감에서 삭제된 카드예요."); return; }
  openDetail(idx);
}
$("diaryList").onclick = e => {
  const chip = e.target.closest(".attach");
  if (chip) { openCardByName(chip.dataset.card); return; }
  const page = e.target.closest(".page");
  if (page) openDiaryForm({ id:page.dataset.id });
};
function recallClick(e) {
  const b = e.target.closest("button[data-id]"); if (b) openDiaryForm({ id:b.dataset.id });
}
$("recallD").onclick = recallClick; $("recallC").onclick = recallClick;
$("fabDiary").onclick = () => openDiaryForm();

/* ----- 일기 쓰기 창 ----- */
let dEditId = null, dMood = "😊", dPhoto = "", dCards = [];
function drawMoods() {
  $("dfMoods").innerHTML = MOODS.map(m => `<button type="button" data-m="${m}" aria-label="기분 ${m}" aria-pressed="${m === dMood}">${m}</button>`).join("");
}
function drawPicks() {
  const names = [...new Set([...items.map(i => i.name), ...dCards])];
  $("dfPicks").innerHTML = names.length
    ? names.map(n => `<button type="button" class="pick" data-n="${esc(n)}" aria-pressed="${dCards.indexOf(n) >= 0}">${cardIcon(n)} ${esc(n)}</button>`).join("")
    : `<span class="nopick">도감에 카드를 먼저 담으면 여기서 연결할 수 있어요.</span>`;
}
function drawDPhoto() {
  $("dfPreview").style.display = dPhoto ? "block" : "none"; $("dfPreview").src = dPhoto;
  $("dfPRemove").style.display = dPhoto ? "inline-block" : "none";
}
function openDiaryForm(opt) {
  opt = opt || {};
  let en = opt.id ? diary.find(x => x.id === opt.id) : null;
  const date = en ? en.date : (opt.date || TODAY);
  if (!en) en = diary.find(x => x.date === date) || null;     // 그 날짜에 이미 쓴 일기가 있으면 그걸 고쳐요
  dEditId = en ? en.id : null;
  $("dfTitle").textContent = en ? "일기 고치기" : "새 일기";
  $("dfDate").value = date;
  dMood = en ? en.mood : "😊";
  $("dfText").value = en ? en.text : "";
  dPhoto = en ? en.photo : "";
  dCards = en ? en.cards.slice() : [];
  if (opt.card && dCards.indexOf(opt.card) < 0) dCards.push(opt.card);
  $("dfDelete").hidden = !en;
  drawMoods(); drawPicks(); drawDPhoto();
  $("dform").classList.add("show"); $("dfText").focus();
}
function closeDiaryForm() { $("dform").classList.remove("show"); $("dfForm").reset(); dEditId = null; dPhoto = ""; dCards = []; drawDPhoto(); }
$("dfMoods").onclick = e => {
  const b = e.target.closest("button"); if (!b) return;
  dMood = b.dataset.m; drawMoods();
};
$("dfPicks").onclick = e => {
  const b = e.target.closest(".pick"); if (!b) return;
  const n = b.dataset.n, i = dCards.indexOf(n);
  if (i >= 0) dCards.splice(i, 1); else dCards.push(n);
  drawPicks();
};
$("dfPhoto").onchange = e => readPhoto(e.target.files[0], url => { dPhoto = url; drawDPhoto(); });
$("dfPRemove").onclick = () => { dPhoto = ""; $("dfPhoto").value = ""; drawDPhoto(); };
$("dfCancel").onclick = closeDiaryForm;
$("dform").onclick = e => { if (e.target === $("dform")) closeDiaryForm(); };
$("dfDelete").onclick = async () => {
  if (!(await ask("이 일기를 삭제할까요?", "삭제"))) return;
  diary = diary.filter(x => x.id !== dEditId);
  save(); closeDiaryForm(); refresh(); toast("일기를 삭제했어요.");
};
$("dfForm").onsubmit = async e => {
  e.preventDefault();
  const date = $("dfDate").value;
  if (!date) { toast("날짜를 골라주세요."); return; }
  const text = $("dfText").value.trim();
  if (!text && !dPhoto) { toast("한 줄이라도 적어보세요."); return; }
  const clash = diary.find(x => x.date === date && x.id !== dEditId);
  if (clash && !(await ask("이 날짜에는 이미 일기가 있어요. 지금 내용으로 덮어쓸까요?", "덮어쓰기"))) return;
  const entry = { id: dEditId || uid(), date, mood: dMood, text, photo: dPhoto, cards: dCards.slice() };
  diary = diary.filter(x => x.id !== entry.id && !(clash && x.id === clash.id));
  diary.push(entry);
  const d = parseYmd(date); calY = d.getFullYear(); calM = d.getMonth();
  save(); closeDiaryForm(); refresh(); toast("일기를 저장했어요.");
};

/* =====================  달력  ===================== */
let calY = new Date().getFullYear(), calM = new Date().getMonth();
function renderCal() {
  const prefix = calY + "-" + pad(calM + 1);
  $("calTitle").textContent = `${calY}년 ${calM + 1}월`;
  $("calStats").textContent = calY + "-" + pad(calM + 1) === TODAY.slice(0, 7)
    ? statsText(prefix) : `${monthCount(prefix)}편을 기록했어요`;
  const map = {}; diary.forEach(e => { map[e.date] = e; });
  const first = new Date(calY, calM, 1).getDay(), last = new Date(calY, calM + 1, 0).getDate();
  let html = DOW.map(n => `<div class="dn">${n}</div>`).join("");
  for (let i = 0; i < first; i++) html += `<div class="blank"></div>`;
  for (let d = 1; d <= last; d++) {
    const key = prefix + "-" + pad(d), en = map[key];
    html += `<button data-d="${key}" class="${en ? "has" : ""}${key === TODAY ? " today" : ""}" aria-label="${calM + 1}월 ${d}일${en ? " 일기 있음" : ""}">${en ? `<em>${en.mood}</em>` : ""}${d}</button>`;
  }
  $("cal").innerHTML = html;
  $("recallC").innerHTML = recallHtml();
}
$("cal").onclick = e => { const b = e.target.closest("button[data-d]"); if (b) openDiaryForm({ date:b.dataset.d }); };
$("calPrev").onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); };
$("calNext").onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); };

/* 테마 */
const THEMES = ["rose","lavender","mint","mocha","night"];
function applyTheme(t) {
  if (!THEMES.includes(t)) t = "rose";
  document.documentElement.setAttribute("data-theme", t);
  document.querySelectorAll("#themes button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === t)));
}
document.querySelectorAll("#themes button").forEach(b => b.onclick = () => {
  applyTheme(b.dataset.t);
  try { localStorage.setItem("taste-theme", b.dataset.t); } catch (e) {}
});
{ let t = "rose"; try { t = localStorage.getItem("taste-theme") || "rose"; } catch (e) {} applyTheme(t); }

/* =====================  설정, 백업  ===================== */
function openSettings() {
  $("setCount").textContent = `지금 카드 ${items.length}개 · 일기 ${diary.length}편이 저장돼 있어요.`;
  $("settings").classList.add("show");
}
$("setBtn").onclick = openSettings;
$("setClose").onclick = () => $("settings").classList.remove("show");
$("settings").onclick = e => { if (e.target === $("settings")) $("settings").classList.remove("show"); };

$("exportBtn").onclick = () => {
  const data = { app:"taste-collection", version:1, exportedAt:new Date().toISOString(), items, diary };
  const blob = new Blob([JSON.stringify(data)], { type:"application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "좋아서모아둔것들-백업-" + TODAY + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("백업 파일을 저장했어요. 다운로드 폴더를 확인해 보세요.");
};
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    let d;
    try { d = JSON.parse(reader.result); } catch (err) { toast("백업 파일을 읽을 수 없어요. 내보내기로 만든 파일이 맞는지 확인해 주세요."); return; }
    const ok = d && Array.isArray(d.items) && Array.isArray(d.diary)
      && d.items.every(i => i && typeof i.name === "string" && typeof i.type === "string")
      && d.diary.every(x => x && typeof x.date === "string" && /^\d{4}-\d{2}-\d{2}$/.test(x.date));
    if (!ok) { toast("이 파일은 백업 파일이 아니에요."); return; }
    if (!(await ask(`카드 ${d.items.length}개와 일기 ${d.diary.length}편으로 바꿀까요? 지금 내용은 사라져요.`, "바꾸기"))) return;
    items = d.items.map(cleanItem); diary = d.diary.map(cleanEntry);
    save(); current = "전체"; refresh(); $("settings").classList.remove("show"); toast("백업을 불러왔어요.");
  };
  reader.readAsText(file);
};

/* ---------- 키보드: Esc로 팝업 닫기 ---------- */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if ($("ask").classList.contains("show")) { $("askNo").click(); return; }
  closeDetail(); closeModal(); closeDiaryForm(); $("settings").classList.remove("show");
});

refresh();
</script>
</body>
